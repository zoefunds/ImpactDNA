name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genvm-linter
      - run: genvm-lint check contracts/impact_dna.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://impactdna-milestone-api.fly.dev
          NEXT_PUBLIC_GENLAYER_CONTRACT_ADDRESS: 0x18de100d155851cb179a6dF17f301C158aDed0AC
          NEXT_PUBLIC_USDC_CONTRACT_ADDRESS: 0x036CbD53842c5426634e7929541eC2318f3dCF7e
          NEXT_PUBLIC_IMPACT_DNA_ESCROW_ADDRESS: 0xB5777c54047DF43024650197B560A227e35f25B8
